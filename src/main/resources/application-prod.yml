spring:
  config.activate.on-profile: prod
  datasource.url: ${DB_URL}
  datasource.username: ${DB_USERNAME}
  datasource.password: ${DB_PASSWORD}
  datasource.driver-class-name: org.postgresql.Driver
  jpa.hibernate.ddl-auto: validate
  jpa.database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway.enabled: true
server.port: ${SERVER_PORT:8080}
app.jwt.issuer: ${JWT_ISSUER}
app.jwt.secret: ${JWT_SECRET}
app.jwt.expiration: ${JWT_EXPIRATION:PT15M}
app.jwt.audience: ${JWT_AUDIENCE}
app.security.writer-password: ${WRITER_PASSWORD}
app.security.admin-password: ${ADMIN_PASSWORD}
app.security.allowed-origins: ${ALLOWED_ORIGINS}
app.security.rate-limit.login-per-window: ${LOGIN_RATE_LIMIT:10}
app.security.rate-limit.write-per-window: ${WRITE_RATE_LIMIT:120}
app.security.rate-limit.window: ${RATE_LIMIT_WINDOW:PT1M}
