spring:
  application.name: audit-log-service-test
  datasource.url: jdbc:h2:mem:audit-log-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
  datasource.username: sa
  datasource.password:
  datasource.driver-class-name: org.h2.Driver
  jpa.hibernate.ddl-auto: create-drop
  jpa.database-platform: org.hibernate.dialect.H2Dialect
  flyway.enabled: false
  h2.console.enabled: false
app.jwt.issuer: audit-log-service-test
app.jwt.secret: test-only-secret-that-is-at-least-32-chars
app.jwt.expiration: PT5M
app.jwt.audience: audit-log-service-test
app.security.writer-password: local-writer-password
app.security.admin-password: local-admin-password
app.security.allowed-origins: http://localhost:3000
external.integrations.enabled: false
